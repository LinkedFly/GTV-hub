<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 移动端适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTV-hub | 2D Map Demo - Multi Great Circle Flight</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        html, body { height: 100%; font-family: system-ui, sans-serif; }
        #map { width:100%; height:calc(100% - 110px); }
        .info-bar {
            height:60px;
            padding:10px 16px;
            background:#003154;
            color:#fff;
            display:flex;
            gap:24px;
            align-items:center;
            flex-wrap:wrap;
        }
        .control-panel {
            min-height:50px;
            background:#f2f4f7;
            display:flex;
            gap:12px;
            align-items:center;
            padding:8px 16px;
            flex-wrap:wrap;
        }
        .control-panel label {font-size:14px;}
        button {padding:4px 10px;cursor:pointer}
    </style>
</head>
<body>
    <div class="info-bar">
        <span>佛得角酒店 ↔ 古城直线距离：<span id="distance">--</span> km</span>
        <span>大圆航班距离：<span id="flightDist">--</span> km</span>
    </div>
    <div class="control-panel">
        <label>航线选择
            <select id="routeSelect">
                <option value="LIS-CV">LIS里斯本 → CV佛得角</option>
                <option value="CAN-LIS">CAN广州 → LIS里斯本</option>
            </select>
        </label>
        <label>航线颜色
            <select id="colorSelect">
                <option value="#009999">青 #009999</option>
                <option value="#D20A14">红 #D20A14</option>
                <option value="#003154">深蓝 #003154</option>
            </select>
        </label>
        <label>线宽
            <input type="number" id="weightInput" value="4" min="1" max="10" style="width:45px">
        </label>
        <button id="updateLineBtn">更新航线样式</button>
        <button id="playAnimBtn">播放飞机动画</button>
        <button id="resetViewBtn">重置地图视图</button>
    </div>
    <div id="map"></div>

    <!-- 引入公共地理算法模块（ES Module） -->
    <script type="module">
        import { calcDistance, greatCirclePoints } from '../poi-calc/poi-calc.js';

        // ===================== 航线配置表 =====================
        const routeConfig = {
            "LIS-CV": {
                name: "LIS里斯本 → CV佛得角",
                dep: [38.7223, -9.1393],
                arr: [14.9168, -23.5082],
                view: [26, -16],
                zoom: 4
            },
            "CAN-LIS": {
                name: "CAN广州 → LIS里斯本",
                dep: [23.3923, 113.2988],
                arr: [38.7223, -9.1393],
                view: [32, 10],
                zoom: 3
            }
        };

        // 佛得角本地点位
        const hotelLat = 14.9168;
        const hotelLng = -23.5082;
        const unescoLat = 14.9117;
        const unescoLng = -23.6044;

        const map = L.map('map').setView([26, -16], 4);

        // Esri 卫星底图（国内可直连，无需 KEY）
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri | GTV-hub Demo',
            maxZoom: 19
        }).addTo(map);

        // 本地 POI 标记
        L.marker([hotelLat, hotelLng]).addTo(map)
            .bindPopup("<b>InterContinental Cape Verde</b><br>Hotel POI");
        L.marker([unescoLat, unescoLng]).addTo(map)
            .bindPopup("<b>UNESCO: Cidade Velha</b>");
        L.polyline([[hotelLat, hotelLng],[unescoLat, unescoLng]], {color:"#D20A14", weight:3}).addTo(map);
        document.getElementById("distance").innerText =
            calcDistance(hotelLat, hotelLng, unescoLat, unescoLng);

        // 航线图层状态
        let flightLine = null;
        let markerDep = null;
        let markerArr = null;
        let flightPoints = [];
        let planeMarker = null;
        let animTimer = null;

        // 渲染指定航线
        function renderRoute(routeKey) {
            // 清理旧图层与动画
            if (flightLine) map.removeLayer(flightLine);
            if (markerDep) map.removeLayer(markerDep);
            if (markerArr) map.removeLayer(markerArr);
            if (planeMarker) map.removeLayer(planeMarker);
            if (animTimer) { clearInterval(animTimer); animTimer = null; }
            planeMarker = null;

            const r = routeConfig[routeKey];
            const [depLat, depLng] = r.dep;
            const [arrLat, arrLng] = r.arr;

            flightPoints = greatCirclePoints(depLat, depLng, arrLat, arrLng, 60);
            const color = document.getElementById("colorSelect").value;
            const w = Number(document.getElementById("weightInput").value);
            flightLine = L.polyline(flightPoints, {color, weight:w, dashArray:"8,6"}).addTo(map);

            const [depName, arrName] = r.name.split("→").map(s => s.trim());
            markerDep = L.marker([depLat, depLng]).addTo(map).bindPopup(`<b>Departure</b><br>${depName}`);
            markerArr = L.marker([arrLat, arrLng]).addTo(map).bindPopup(`<b>Arrival</b><br>${arrName}`);

            document.getElementById("flightDist").innerText =
                calcDistance(depLat, depLng, arrLat, arrLng);
            map.setView(r.view, r.zoom);
        }

        // 事件绑定
        document.getElementById("routeSelect").onchange = () => {
            renderRoute(document.getElementById("routeSelect").value);
        };

        document.getElementById("updateLineBtn").onclick = () => {
            const color = document.getElementById("colorSelect").value;
            const w = Number(document.getElementById("weightInput").value);
            map.removeLayer(flightLine);
            flightLine = L.polyline(flightPoints, {color, weight:w, dashArray:"8,6"}).addTo(map);
        };

        document.getElementById("playAnimBtn").onclick = () => {
            if (animTimer) clearInterval(animTimer);
            if (planeMarker) map.removeLayer(planeMarker);
            let idx = 0;
            planeMarker = L.marker(flightPoints[0], {
                icon: L.icon({
                    iconUrl: "https://cdn-icons-png.flaticon.com/32/126/126472.png",
                    iconSize: [24, 24]
                })
            }).addTo(map);
            animTimer = setInterval(() => {
                idx++;
                if (idx >= flightPoints.length) {
                    clearInterval(animTimer);
                    animTimer = null;
                    return;
                }
                planeMarker.setLatLng(flightPoints[idx]);
            }, 80);
        };

        document.getElementById("resetViewBtn").onclick = () => {
            const r = routeConfig[document.getElementById("routeSelect").value];
            map.setView(r.view, r.zoom);
        };

        // 默认加载第一条航线
        renderRoute("LIS-CV");
    </script>
</body>
</html>
