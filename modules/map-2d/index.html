<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 移动端适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTV-hub | 2D Map Demo - Multi Great Circle Flight</title>
    <!-- Leaflet 本地化（vendor，避免外网 CDN 不可达） -->
    <link rel="stylesheet" href="../../libs/leaflet/leaflet.min.css" />
    <script src="../../libs/leaflet/leaflet.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        html, body { height: 100%; font-family: system-ui, sans-serif; }
        #map { width:100%; height:calc(100% - 110px); }
        .info-bar {
            height:60px;
            padding:10px 16px;
            background:#003154;
            color:#fff;
            display:flex;
            gap:24px;
            align-items:center;
            flex-wrap:wrap;
        }
        .control-panel {
            min-height:50px;
            background:#f2f4f7;
            display:flex;
            gap:12px;
            align-items:center;
            padding:8px 16px;
            flex-wrap:wrap;
        }
        .control-panel label {font-size:14px;}
        button {padding:4px 10px;cursor:pointer}
    </style>
</head>
<body>
    <div class="info-bar">
        <span>酒店 ↔ 古城直线距离：<span id="distance">--</span> km</span>
        <span>大圆航班距离：<span id="flightDist">--</span> km</span>
        <span>执飞航司：<span id="airlineInfo">--</span></span>
    </div>
    <div class="control-panel">
        <label>航线选择
            <select id="routeSelect"></select>
        </label>
        <label>航线颜色
            <select id="colorSelect">
                <option value="#009999">青 #009999</option>
                <option value="#D20A14">红 #D20A14</option>
                <option value="#003154">深蓝 #003154</option>
            </select>
        </label>
        <label>线宽
            <input type="number" id="weightInput" value="4" min="1" max="10" style="width:45px">
        </label>
        <button id="updateLineBtn">更新航线样式</button>
        <button id="playAnimBtn">播放飞机动画</button>
        <button id="resetViewBtn">重置地图视图</button>
    </div>
    <div id="map"></div>

    <!-- 引入公共地理算法模块（ES Module） -->
    <script type="module">
        import { calcDistance, greatCirclePoints } from '../poi-calc/poi-calc.js';
        import { loadMetadata, enrichPlace, getAirline } from '../../core/metadata/metadata.js';

        // 航线 / POI 配置统一从 data/routes.json 读取（2D / 3D 共用）
        const config = await (await fetch('../../data/routes.json')).json();
        // 元数据引擎：加载国家 / 机场数据集
        const md = await loadMetadata();

        const map = L.map('map').setView([26, -16], 4);

        // Esri 卫星底图（国内可直连，无需 KEY）
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri | GTV-hub Demo',
            maxZoom: 19
        }).addTo(map);

        // 生成端点弹窗文案（经元数据引擎丰富：国家中文名/洲/货币/时区/机场全名）
        function placePopup(p) {
            const e = enrichPlace(md, p);
            const title = e.iata ? `<b>${e.iata} ${e.city}</b>` : `<b>${e.city}</b>`;
            const parts = [title];
            if (e.countryName) parts.push(`国家：${e.countryName}`);
            if (e.continent) parts.push(`洲：${e.continent}`);
            if (e.currency) parts.push(`货币：${e.currency}`);
            if (e.tz) parts.push(`时区：${e.tz}`);
            return parts.join('<br>');
        }

        // 绘制 POI（酒店 / UNESCO）
        for (const poi of Object.values(config.pois)) {
            L.marker([poi.lat, poi.lon]).addTo(map).bindPopup(
                `<b>${poi.name}</b><br>类型：${poi.type}${poi.country ? `<br>国家：${poi.country}` : ''}`
            );
        }

        // 酒店 ↔ 古城直线距离
        const poiVals = Object.values(config.pois);
        if (poiVals.length >= 2) {
            const a = poiVals[0], b = poiVals[1];
            L.polyline([[a.lat, a.lon],[b.lat, b.lon]], {color:"#D20A14", weight:3}).addTo(map);
            document.getElementById("distance").innerText =
                calcDistance(a.lat, a.lon, b.lat, b.lon);
        }

        // 航线下拉由配置生成
        const routeSelect = document.getElementById("routeSelect");
        for (const key of Object.keys(config.routes)) {
            const opt = document.createElement("option");
            opt.value = key;
            opt.textContent = config.routes[key].name;
            routeSelect.appendChild(opt);
        }

        // 航线图层状态
        let flightLine = null, markerDep = null, markerArr = null;
        let flightPoints = [], planeMarker = null, animTimer = null;

        function renderRoute(routeKey) {
            if (flightLine) map.removeLayer(flightLine);
            if (markerDep) map.removeLayer(markerDep);
            if (markerArr) map.removeLayer(markerArr);
            if (planeMarker) map.removeLayer(planeMarker);
            if (animTimer) { clearInterval(animTimer); animTimer = null; }
            planeMarker = null;

            const r = config.routes[routeKey];
            const dep = r.dep, arr = r.arr;

            flightPoints = greatCirclePoints(dep.lat, dep.lon, arr.lat, arr.lon, 60);
            const color = document.getElementById("colorSelect").value;
            const w = Number(document.getElementById("weightInput").value);
            flightLine = L.polyline(flightPoints, {color, weight:w, dashArray:"8,6"}).addTo(map);

            markerDep = L.marker([dep.lat, dep.lon]).addTo(map).bindPopup(
                `<b>Departure</b><br>${placePopup(dep)}`
            );
            markerArr = L.marker([arr.lat, arr.lon]).addTo(map).bindPopup(
                `<b>Arrival</b><br>${placePopup(arr)}`
            );

            document.getElementById("flightDist").innerText =
                calcDistance(dep.lat, dep.lon, arr.lat, arr.lon);
            const al = getAirline(md, r.airline);
            document.getElementById("airlineInfo").innerText =
                al ? `${al.name_zh}（${al.alliance} · ${al.country}）` : (r.airline || '--');
            map.setView(r.view, r.zoom);
        }

        routeSelect.onchange = () => renderRoute(routeSelect.value);

        document.getElementById("updateLineBtn").onclick = () => {
            const color = document.getElementById("colorSelect").value;
            const w = Number(document.getElementById("weightInput").value);
            map.removeLayer(flightLine);
            flightLine = L.polyline(flightPoints, {color, weight:w, dashArray:"8,6"}).addTo(map);
        };

        document.getElementById("playAnimBtn").onclick = () => {
            if (animTimer) clearInterval(animTimer);
            if (planeMarker) map.removeLayer(planeMarker);
            let idx = 0;
            // 本地 emoji 飞机图标，无外部 CDN 依赖
            planeMarker = L.marker(flightPoints[0], {
                icon: L.divIcon({
                    className: 'plane-ico',
                    html: '<span style="font-size:22px;line-height:1">&#9992;&#65039;</span>',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                })
            }).addTo(map);
            animTimer = setInterval(() => {
                idx++;
                if (idx >= flightPoints.length) {
                    clearInterval(animTimer);
                    animTimer = null;
                    return;
                }
                planeMarker.setLatLng(flightPoints[idx]);
            }, 80);
        };

        document.getElementById("resetViewBtn").onclick = () => {
            const r = config.routes[routeSelect.value];
            map.setView(r.view, r.zoom);
        };

        // 默认加载第一条航线
        renderRoute(routeSelect.value);
    </script>
</body>
</html>
