<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTV-hub | 3D Globe Demo (Cesium)</title>
    <!-- Cesium 本地化（vendor，避免外网 CDN 不可达） -->
    <link href="../../libs/cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="../../libs/cesium/Cesium.js"></script>
    <style>
        * {margin:0;padding:0;}
        html, body { height:100%; overflow:hidden; }
        #cesiumContainer { width:100%; height:100%; }
        .info-badge {
            position:absolute; top:12px; left:12px; z-index:10;
            background:#003154; color:#fff; padding:8px 14px;
            border-radius:4px; font-family:system-ui,sans-serif; font-size:13px;
            max-width:360px; line-height:1.5;
        }
    </style>
</head>
<body>
    <div class="info-badge" id="flightInfo">加载中…</div>
    <div id="cesiumContainer"></div>

    <script type="module">
        import { calcDistance, greatCirclePoints } from '../poi-calc/poi-calc.js';
        import { loadMetadata, enrichPlace, getAirline } from '../../core/metadata/metadata.js';

        // 航线 / POI 配置统一从 data/routes.json 读取（2D / 3D 共用）
        const config = await (await fetch('../../data/routes.json')).json();
        // 元数据引擎：加载国家 / 机场数据集
        const md = await loadMetadata();
        // 3D 演示默认使用第一条航线
        const route = Object.values(config.routes)[0];
        const dep = route.dep, arr = route.arr;
        const flightAlt = 500000; // 航线离地高度（米），视觉分层

        // 关闭 Ion 默认 token，改用 OSM 底图 + 椭球地形（无需账号）
        Cesium.Ion.defaultAccessToken = '';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            animation: false,
            timeline: false,
            geocoder: false,
            baseLayerPicker: false,
            homeButton: false,
            navigationHelpButton: false,
            sceneModePicker: true
        });
        // 同步方式添加 OSM 底图（1.123 无 fromUrl，用同步构造）
        viewer.imageryLayers.removeAll();
        viewer.imageryLayers.addImageryProvider(
            new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' })
        );
        viewer.scene.globe.enableLighting = true;

        // 多航线叠加：所有航线以调色板颜色绘制大圆 + 端点圆点
        const PALETTE = ["#009999","#D20A14","#003154","#FEDD00","#e86a2e","#7a5cff","#1f9d55","#d4458c","#2b7ff5","#b58900","#18b8a6","#f0523d"];
        const allRoutes = Object.values(config.routes);
        allRoutes.forEach((r, i) => {
            const pts = greatCirclePoints(r.dep.lat, r.dep.lon, r.arr.lat, r.arr.lon, 80);
            const positions = pts.map(p => Cesium.Cartesian3.fromDegrees(p[1], p[0], flightAlt));
            viewer.entities.add({
                polyline: {
                    positions,
                    width: 3000,
                    material: new Cesium.PolylineDashMaterialProperty({
                        color: Cesium.Color.fromCssColorString(PALETTE[i % PALETTE.length]),
                        dashLength: 16000
                    })
                }
            });
            [r.dep, r.arr].forEach(p => {
                viewer.entities.add({
                    position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat),
                    point: { pixelSize: 6, color: Cesium.Color.fromCssColorString(PALETTE[i % PALETTE.length]) }
                });
            });
        });

        // 标注标签（经元数据引擎丰富：机场全名/IATA/国家/洲/货币/时区）
        function labelText(p, prefix) {
            const e = enrichPlace(md, p);
            const iata = e.iata ? ` ${e.iata}` : '';
            const lines = [`${prefix}${iata}`, e.city];
            if (e.countryName) lines.push(e.countryName);
            if (e.continent) lines.push(e.continent);
            if (e.currency) lines.push(`货币 ${e.currency}`);
            if (e.tz) lines.push(e.tz);
            return lines.join('\n');
        }

        viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(dep.lon, dep.lat),
            point: { pixelSize: 10, color: Cesium.Color.ORANGE },
            label: {
                text: labelText(dep, '起飞机场'),
                font: '14px sans-serif',
                pixelOffset: new Cesium.Cartesian2(0, -24),
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 3
            }
        });
        viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(arr.lon, arr.lat),
            point: { pixelSize: 10, color: Cesium.Color.TEAL },
            label: {
                text: labelText(arr, '到达'),
                font: '14px sans-serif',
                pixelOffset: new Cesium.Cartesian2(0, -24),
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 3
            }
        });

        // 信息栏：默认航线 + 大圆距离 + 起终点（元数据丰富）+ 执飞航司 + 叠加总数
        const dist = calcDistance(dep.lat, dep.lon, arr.lat, arr.lon);
        const de = enrichPlace(md, dep), ae = enrichPlace(md, arr);
        const al = getAirline(md, route.airline);
        document.getElementById("flightInfo").innerHTML =
            `<b>${route.name}</b><br>大圆航线距离：${dist} km` +
            `<br>${de.city}（${de.countryName || de.country}） → ${ae.city}（${ae.countryName || ae.country}）` +
            `<br>执飞航司：${al ? `${al.name_zh}（${al.alliance}）` : (route.airline || '--')}` +
            `<br><span style="opacity:.8">已叠加全部 ${allRoutes.length} 条全球大圆航线</span>`;

        // 视角定位到航线
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(route.view[1], route.view[0], 14000000)
        });
    </script>
</body>
</html>
