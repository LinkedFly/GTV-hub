<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTV-hub | 3D Globe Demo (Cesium)</title>
    <!-- Cesium CDN -->
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.123/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.123/Build/Cesium/Cesium.js"></script>
    <style>
        * {margin:0;padding:0;}
        html, body { height:100%; overflow:hidden; }
        #cesiumContainer { width:100%; height:100%; }
        .info-badge {
            position:absolute; top:12px; left:12px; z-index:10;
            background:#003154; color:#fff; padding:8px 14px;
            border-radius:4px; font-family:system-ui,sans-serif; font-size:13px;
            max-width:360px; line-height:1.5;
        }
    </style>
</head>
<body>
    <div class="info-badge" id="flightInfo">加载中…</div>
    <div id="cesiumContainer"></div>

    <script type="module">
        import { calcDistance, greatCirclePoints } from '../poi-calc/poi-calc.js';

        // 航线 / POI 配置统一从 data/routes.json 读取（2D / 3D 共用）
        const config = await (await fetch('../../data/routes.json')).json();
        // 3D 演示默认使用第一条航线
        const route = Object.values(config.routes)[0];
        const dep = route.dep, arr = route.arr;
        const flightAlt = 500000; // 航线离地高度（米），视觉分层

        // 关闭 Ion 默认 token，改用 OSM 底图 + 椭球地形（无需账号）
        Cesium.Ion.defaultAccessToken = '';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayer: Cesium.ImageryLayer.fromProviderAsync(
                Cesium.OpenStreetMapImageryProvider.fromUrl('https://tile.openstreetmap.org/')
            ),
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            animation: false,
            timeline: false,
            geocoder: false,
            baseLayerPicker: false,
            homeButton: false,
            navigationHelpButton: false,
            sceneModePicker: true
        });
        viewer.scene.globe.enableLighting = true;

        // 复用 poi-calc 生成大圆航线采样点
        const pts = greatCirclePoints(dep.lat, dep.lon, arr.lat, arr.lon, 80);
        const positions = pts.map(p =>
            Cesium.Cartesian3.fromDegrees(p[1], p[0], flightAlt)
        );

        viewer.entities.add({
            polyline: {
                positions,
                width: 4000,
                material: new Cesium.PolylineDashMaterialProperty({
                    color: Cesium.Color.fromCssColorString('#009999'),
                    dashLength: 16000
                })
            }
        });

        // 标注标签（含 IATA / 国家 / 时区）
        function labelText(p, prefix) {
            const iata = p.iata ? ` ${p.iata}` : '';
            const country = p.country ? `\n${p.country}` : '';
            const tz = p.tz ? `\n${p.tz}` : '';
            return `${prefix}${iata}\n${p.city}${country}${tz}`;
        }

        viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(dep.lon, dep.lat),
            point: { pixelSize: 10, color: Cesium.Color.ORANGE },
            label: {
                text: labelText(dep, '起飞机场'),
                font: '14px sans-serif',
                pixelOffset: new Cesium.Cartesian2(0, -24),
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 3
            }
        });
        viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(arr.lon, arr.lat),
            point: { pixelSize: 10, color: Cesium.Color.TEAL },
            label: {
                text: labelText(arr, '到达'),
                font: '14px sans-serif',
                pixelOffset: new Cesium.Cartesian2(0, -24),
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 3
            }
        });

        // 信息栏：航线名 + 大圆距离
        const dist = calcDistance(dep.lat, dep.lon, arr.lat, arr.lon);
        document.getElementById("flightInfo").innerHTML =
            `<b>${route.name}</b><br>大圆航线距离：${dist} km` +
            `<br>${dep.city}（${dep.country}） → ${arr.city}（${arr.country}）`;

        // 视角定位到航线
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(route.view[1], route.view[0], 14000000)
        });
    </script>
</body>
</html>
